name: Build and publish image
description: Shared multi-architecture image publication
inputs:
  version:
    description: Image version
    required: true
  revision:
    description: Source commit
    required: true
  token:
    description: GHCR token
    required: true
  push_latest:
    description: Update latest tag
    default: "true"
runs:
  using: composite
  steps:
    - name: Image tags
      id: image
      shell: bash
      env:
        VERSION: ${{ inputs.version }}
        PUSH_LATEST: ${{ inputs.push_latest }}
      run: |
        set -euo pipefail
        [[ "$VERSION" =~ ^[A-Za-z0-9_][A-Za-z0-9_.-]{0,127}$ ]] || { echo "Invalid image version" >&2; exit 1; }
        image="$(printf 'ghcr.io/%s' "$GITHUB_REPOSITORY" | tr '[:upper:]' '[:lower:]')"
        {
          echo 'tags<<IMAGE_TAGS'
          echo "$image:$VERSION"
          if [[ "$PUSH_LATEST" == "true" ]]; then echo "$image:latest"; fi
          echo IMAGE_TAGS
        } >> "$GITHUB_OUTPUT"
    - uses: docker/setup-qemu-action@v3
    - uses: docker/setup-buildx-action@v3
    - uses: docker/login-action@v3
      with:
        registry: ghcr.io
        username: ${{ github.actor }}
        password: ${{ inputs.token }}
    - uses: docker/build-push-action@v6
      with:
        context: .
        push: true
        platforms: linux/amd64,linux/arm64
        cache-from: type=gha
        cache-to: type=gha,mode=max
        build-args: |
          APP_VERSION=${{ inputs.version }}
          APP_REVISION=${{ inputs.revision }}
          APP_SOURCE=${{ github.server_url }}/${{ github.repository }}
        tags: ${{ steps.image.outputs.tags }}

name: Release And Publish GHCR

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      image_tag:
        description: "Override image tag (default: manual-<shortsha>)"
        required: false
        type: string
      push_latest:
        description: "Also push :latest tag"
        required: false
        type: boolean
        default: true

permissions:
  contents: write
  packages: write

concurrency:
  group: publish-ghcr
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v5
      - name: Derive version
        id: version
        env:
          IMAGE_TAG: ${{ inputs.image_tag }}
          PUSH_LATEST: ${{ inputs.push_latest }}
        run: |
          set -euo pipefail
          if [[ "$GITHUB_REF_TYPE" == "tag" ]]; then
            [[ "$GITHUB_REF_NAME" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo 'Invalid release tag' >&2; exit 1; }
            version="${GITHUB_REF_NAME#v}"
            push_latest=true
          else
            version="${IMAGE_TAG:-manual-${GITHUB_SHA::7}}"
            push_latest="$PUSH_LATEST"
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "push_latest=$push_latest" >> "$GITHUB_OUTPUT"
      - name: Publish image
        uses: ./.github/actions/publish
        with:
          version: ${{ steps.version.outputs.version }}
          revision: ${{ github.sha }}
          push_latest: ${{ steps.version.outputs.push_latest }}
          token: ${{ github.token }}
      - name: Create source archive
        if: github.ref_type == 'tag'
        run: git archive --format=tar.gz --output "docker-clash-${GITHUB_REF_NAME}.tar.gz" "${GITHUB_SHA}"
      - name: Create draft release
        if: github.ref_type == 'tag'
        uses: softprops/action-gh-release@v2
        with:
          draft: true
          generate_release_notes: false
          body: 请手动补充本版本更新日志。
          files: docker-clash-${{ github.ref_name }}.tar.gz

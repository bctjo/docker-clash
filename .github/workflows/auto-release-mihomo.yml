name: Auto Release On Mihomo Update

on:
  schedule:
    - cron: "19 */6 * * *"
  workflow_dispatch:

permissions:
  contents: write
  packages: write

concurrency:
  group: publish-ghcr
  cancel-in-progress: false

jobs:
  auto-release:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Check mihomo update
        id: check
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          latest_tag="$(curl -fsSL --retry 3 --retry-delay 3 --retry-all-errors \
            --connect-timeout 10 --max-time 30 --retry-max-time 120 \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H 'Accept: application/vnd.github+json' \
            https://api.github.com/repos/MetaCubeX/mihomo/releases/latest | jq -er '.tag_name')"
          [[ "$latest_tag" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo "Invalid mihomo version" >&2; exit 1; }
          current_tag="$(tr -d '[:space:]' < core/mihomo-version.txt)"
          changed=false
          [[ "$latest_tag" == "$current_tag" ]] || changed=true
          echo "changed=$changed" >> "$GITHUB_OUTPUT"
          echo "latest_tag=$latest_tag" >> "$GITHUB_OUTPUT"

      - name: Prepare local version commit
        id: version
        if: steps.check.outputs.changed == 'true'
        env:
          MIHOMO_TAG: ${{ steps.check.outputs.latest_tag }}
        run: |
          set -euo pipefail
          latest="$(git tag --list | grep -E '^v[0-9]+\.[0-9]+\.[0-9]+$' | sort -V | tail -n1 || true)"
          if [[ -z "$latest" ]]; then
            tag=v1.0.0
          else
            IFS=. read -r major minor patch <<< "${latest#v}"
            tag="v$major.$minor.$((10#$patch + 1))"
          fi
          printf '%s\n' "$MIHOMO_TAG" > core/mihomo-version.txt
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add core/mihomo-version.txt
          git commit -m "chore(core): track mihomo $MIHOMO_TAG"
          {
            echo "tag=$tag"
            echo "version=${tag#v}"
            echo "revision=$(git rev-parse HEAD)"
          } >> "$GITHUB_OUTPUT"

      # Failed builds leave the tracked remote version unchanged for retry.
      - name: Publish image
        if: steps.check.outputs.changed == 'true'
        uses: ./.github/actions/publish
        with:
          version: ${{ steps.version.outputs.version }}
          revision: ${{ steps.version.outputs.revision }}
          token: ${{ github.token }}

      - name: Commit successful publication
        if: steps.check.outputs.changed == 'true'
        env:
          PROJECT_TAG: ${{ steps.version.outputs.tag }}
        run: |
          set -euo pipefail
          git tag "$PROJECT_TAG"
          git push --atomic origin "HEAD:$GITHUB_REF_NAME" "$PROJECT_TAG"

      # Token pushes do not trigger tag workflows; also repair interrupted releases.
      - name: Ensure draft release exists
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          tag="$(git tag --list | grep -E '^v[0-9]+\.[0-9]+\.[0-9]+$' | sort -V | tail -n1 || true)"
          [[ -n "$tag" ]] || exit 0
          if gh release view "$tag" > /dev/null 2>&1; then exit 0; fi
          archive="docker-clash-$tag.tar.gz"
          git archive --format=tar.gz --output "$archive" "$tag"
          gh release create "$tag" "$archive" --verify-tag --draft --title "$tag" --notes '请手动补充本版本更新日志。'

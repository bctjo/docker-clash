map $http_upgrade $portal_connection_upgrade {
  default upgrade;
  '' close;
}

server {
  listen __PORTAL_PORT__;
  server_name _;

  root /opt/portal;
  index index.html;
  add_header X-Content-Type-Options nosniff always;
  add_header Referrer-Policy no-referrer always;

  # Convert auth challenge response to 403 so browser won't show native basic auth dialog.
  error_page 401 = @portal_auth_forbidden;
  location @portal_auth_forbidden {
    internal;
    default_type application/json;
    add_header Cache-Control "no-store" always;
    return 403 '{"error":"unauthorized"}';
  }

  location = /status.json {
    add_header Cache-Control "no-store";
    __PORTAL_AUTH__
  }

  location = /subscription-info.json {
    add_header Cache-Control "no-store";
    __PORTAL_AUTH__
  }

  location = /subscription-validate.json {
    add_header Cache-Control "no-store";
    __PORTAL_AUTH__
  }

  location = /latency-browser.json {
    add_header Cache-Control "no-store";
    __PORTAL_AUTH__
  }

  location = /latency-router.json {
    add_header Cache-Control "no-store";
    __PORTAL_AUTH__
  }

  location = /connection.json {
    add_header Cache-Control "no-store" always;
    __PORTAL_AUTH__
    limit_except GET { deny all; }
  }

  location = /config.js {
    add_header Cache-Control "no-store" always;
  }

  # Never serve temporary files or request payloads (which contain subscription tokens).
  location ~ /\. { deny all; }
  location ~ \.(tmp|bak|new|result)$ { deny all; }

  location ~ "^/tasks/[A-Za-z0-9-]{1,80}\.json$" {
    add_header Cache-Control "no-store" always;
    __PORTAL_AUTH__
    limit_except GET { deny all; }
  }

  location ~ "^/requests/(updates|validations|latency-browser|latency-router|password)/[A-Za-z0-9-]{1,80}$" {
    __PORTAL_AUTH__
    client_max_body_size 4k;
    dav_methods PUT;
    create_full_put_path on;
    access_log off;
    limit_except PUT { deny all; }
  }

  location /requests/ { deny all; }
  location /tasks/ { deny all; }

  location = /settings.json {
    add_header Cache-Control "no-store";
    __PORTAL_AUTH__
    client_max_body_size 2k;
    dav_methods PUT;
    create_full_put_path on;
    access_log off;
    limit_except GET PUT { deny all; }
  }

  location = /subscriptions.json {
    add_header Cache-Control "no-store";
    __PORTAL_AUTH__
    client_max_body_size 16k;
    dav_methods PUT;
    create_full_put_path on;
    access_log off;
    limit_except GET PUT { deny all; }
  }

  location = /subscription-validate {
    add_header Cache-Control "no-store";
    __PORTAL_AUTH__
    client_max_body_size 4k;
    dav_methods PUT;
    create_full_put_path on;
    access_log off;
    limit_except PUT { deny all; }
  }

  location = /update {
    __PORTAL_AUTH__
    client_max_body_size 1k;
    dav_methods PUT;
    create_full_put_path on;
    access_log off;
    limit_except PUT { deny all; }
  }

  location = /latency-browser-refresh {
    __PORTAL_AUTH__
    client_max_body_size 1k;
    dav_methods PUT;
    create_full_put_path on;
    access_log off;
    limit_except PUT { deny all; }
  }

  location = /latency-router-refresh {
    __PORTAL_AUTH__
    client_max_body_size 1k;
    dav_methods PUT;
    create_full_put_path on;
    access_log off;
    limit_except PUT { deny all; }
  }

  # Keep Portal files and protected management routes above; forward dashboard
  # assets and all core endpoints through the same public port.
  location / {
    try_files $uri $uri/ @mihomo;
  }

  location @mihomo {
    proxy_pass http://127.0.0.1:__DASH_PORT__;
    proxy_http_version 1.1;
    proxy_set_header Host $http_host;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection $portal_connection_upgrade;
    proxy_buffering off;
    proxy_read_timeout 3600s;
    # Authentication stays with mihomo (Bearer or WebSocket token).
    # Portal's Basic authentication applies only to Portal management routes.
    access_log off;
  }
}
